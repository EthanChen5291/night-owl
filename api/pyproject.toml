[project]
name = "barn-owl-api"
version = "0.1.0"
description = "Barn Owl demo hub: serves the frozen JSON contract, takes node events, keeps the Beta-Binomial posterior"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "h3>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
